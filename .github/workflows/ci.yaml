name: Bitcoin Regtest CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fund_address:
        description: "Bitcoin address to send funds to (leave blank to auto-generate)"
        required: false
        default: ""

env:
  BITCOIN_VERSION: "27.0"
  FUND_AMOUNT: "10"
  MINE_BLOCKS: "101"

jobs:
  regtest-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - uses: actions/checkout@v4

      #################################################
      # Install Bitcoin Core
      #################################################

      - name: Install Bitcoin Core
        run: |
          set -euo pipefail

          ARCH="x86_64-linux-gnu"
          TARBALL="bitcoin-${BITCOIN_VERSION}-${ARCH}.tar.gz"
          URL="https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/${TARBALL}"

          curl -fsSL "$URL" -o "$TARBALL"
          tar -xzf "$TARBALL"

          sudo install -m 0755 bitcoin-${BITCOIN_VERSION}/bin/bitcoind /usr/local/bin/
          sudo install -m 0755 bitcoin-${BITCOIN_VERSION}/bin/bitcoin-cli /usr/local/bin/

          bitcoind --version

      #################################################
      # Configure nodes
      #################################################

      - name: Configure regtest cluster
        run: |
          set -euo pipefail

          mkdir -p $HOME/.bitcoin/node1
          mkdir -p $HOME/.bitcoin/node2
          mkdir -p $HOME/.bitcoin/node3

          cat > $HOME/.bitcoin/node1/bitcoin.conf <<EOF
          regtest=1
          server=1
          fallbackfee=0.0001
          [regtest]
          port=18444
          EOF

          cat > $HOME/.bitcoin/node2/bitcoin.conf <<EOF
          regtest=1
          server=1
          fallbackfee=0.0001
          [regtest]
          port=18446
          EOF

          cat > $HOME/.bitcoin/node3/bitcoin.conf <<EOF
          regtest=1
          server=1
          fallbackfee=0.0001
          [regtest]
          port=18448
          EOF

      #################################################
      # Start nodes
      #################################################

      - name: Start nodes
        run: |
          set -euo pipefail

          bitcoind -datadir=$HOME/.bitcoin/node1 -daemon
          bitcoind -datadir=$HOME/.bitcoin/node2 -daemon
          bitcoind -datadir=$HOME/.bitcoin/node3 -daemon

          wait_for_rpc() {
            local CLI=$1
            local NAME=$2
            local DIR=$3

            for i in {1..60}; do
              if $CLI getblockcount >/dev/null 2>&1; then
                echo "✅ $NAME ready"
                return 0
              fi
              sleep 1
            done

            echo "❌ $NAME failed to start"
            cat $DIR/regtest/debug.log || true
            exit 1
          }

          CLI1="bitcoin-cli -datadir=$HOME/.bitcoin/node1 -regtest"
          CLI2="bitcoin-cli -datadir=$HOME/.bitcoin/node2 -regtest"
          CLI3="bitcoin-cli -datadir=$HOME/.bitcoin/node3 -regtest"

          wait_for_rpc "$CLI1" node1 "$HOME/.bitcoin/node1"
          wait_for_rpc "$CLI2" node2 "$HOME/.bitcoin/node2"
          wait_for_rpc "$CLI3" node3 "$HOME/.bitcoin/node3"

      #################################################
      # Connect cluster
      #################################################

      - name: Connect nodes
        run: |
          CLI1="bitcoin-cli -datadir=$HOME/.bitcoin/node1 -regtest"
          CLI2="bitcoin-cli -datadir=$HOME/.bitcoin/node2 -regtest"
          CLI3="bitcoin-cli -datadir=$HOME/.bitcoin/node3 -regtest"

          $CLI1 addnode "127.0.0.1:18446" add
          $CLI1 addnode "127.0.0.1:18448" add
          $CLI2 addnode "127.0.0.1:18444" add
          $CLI3 addnode "127.0.0.1:18444" add

          sleep 3

      #################################################
      # Create wallets
      #################################################

      - name: Create wallets
        run: |
          CLI1="bitcoin-cli -datadir=$HOME/.bitcoin/node1 -regtest"
          CLI2="bitcoin-cli -datadir=$HOME/.bitcoin/node2 -regtest"
          CLI3="bitcoin-cli -datadir=$HOME/.bitcoin/node3 -regtest"

          $CLI1 createwallet miner_wallet
          $CLI2 createwallet node2_wallet
          $CLI3 createwallet node3_wallet

      #################################################
      # Mine blocks
      #################################################

      - name: Mine initial blocks
        run: |
          CLI1="bitcoin-cli -datadir=$HOME/.bitcoin/node1 -regtest -rpcwallet=miner_wallet"

          MINER_ADDR=$($CLI1 getnewaddress)

          $CLI1 generatetoaddress $MINE_BLOCKS $MINER_ADDR

          echo "MINER_ADDR=$MINER_ADDR" >> $GITHUB_ENV

      #################################################
      # Resolve target address
      #################################################

      - name: Resolve target address
        run: |
          CLI3="bitcoin-cli -datadir=$HOME/.bitcoin/node3 -regtest -rpcwallet=node3_wallet"

          if [ -n "${{ github.event.inputs.fund_address }}" ]; then
            TARGET_ADDR="${{ github.event.inputs.fund_address }}"
          else
            TARGET_ADDR=$($CLI3 getnewaddress)
          fi

          echo "TARGET_ADDR=$TARGET_ADDR" >> $GITHUB_ENV

      #################################################
      # Send funds
      #################################################

      - name: Send funds
        run: |
          CLI1="bitcoin-cli -datadir=$HOME/.bitcoin/node1 -regtest -rpcwallet=miner_wallet"

          TXID=$($CLI1 sendtoaddress "$TARGET_ADDR" $FUND_AMOUNT)

          $CLI1 generatetoaddress 6 $MINER_ADDR

          echo "TXID=$TXID" >> $GITHUB_ENV

      #################################################
      # Verify
      #################################################

      - name: Verify funds
        run: |
          CLI3="bitcoin-cli -datadir=$HOME/.bitcoin/node3 -regtest -rpcwallet=node3_wallet"

          RECEIVED=$($CLI3 getreceivedbyaddress "$TARGET_ADDR" 1)

          echo "Received: $RECEIVED BTC"

          python3 - <<EOF
          import sys
          if float("$RECEIVED") < float("$FUND_AMOUNT"):
              sys.exit("Funds not received")
          print("Funds verified")
          EOF

      #################################################
      # Summary
      #################################################

      - name: Cluster summary
        if: always()
        run: |
          for NODE in node1 node2 node3; do
            HEIGHT=$(bitcoin-cli -datadir=$HOME/.bitcoin/$NODE -regtest getblockcount || echo "?")
            PEERS=$(bitcoin-cli -datadir=$HOME/.bitcoin/$NODE -regtest getconnectioncount || echo "?")
            echo "$NODE height=$HEIGHT peers=$PEERS"
          done

      #################################################
      # Stop nodes
      #################################################

      - name: Stop nodes
        if: always()
        run: |
          for NODE in node1 node2 node3; do
            bitcoin-cli -datadir=$HOME/.bitcoin/$NODE -regtest stop || true
          done
